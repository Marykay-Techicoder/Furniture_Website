    <main class="form-signin w-100 m-auto">
      <form action="index.html">
        <h1 class="h3 mb-3 fw-normal">Please Login</h1>

        <div class="form-floating">
          <input
            type="email"
            class="form-control"
            id="floatingInput"
            placeholder="name@example.com"
            required
          />
          <label for="floatingInput">Email address</label>
        </div>
        <div class="form-floating">
          <input
            type="password"
            class="form-control"
            id="floatingPassword"
            placeholder="Password"
            required
          />
          <label for="floatingPassword">Password</label>
        </div>

        <div class="form-check text-start my-3">
          <input
            class="form-check-input"
            type="checkbox"
            value="remember-me"
            id="flexCheckDefault"

          />
          <label class="form-check-label" for="flexCheckDefault">
            Remember me
          </label>
        </div>
        
        <a href="/index.html"><button class="btn btn-primary w-100 py-2" type="submit">
          Login
        </button></a>
       
        <p class="mt-5 mb-3 text-body-secondary">&copy; 2017–2024</p>
      </form>
         <!-- sign up button section -->
         <div >
          <h3>Don't have an account? 👇</h3>
          <button
          onclick="document.getElementById('id01').style.display='block'"
          style="width: auto"
          class="btn btn-outline-primary"
          >
          Sign up
        </button>
        
        <form action="sign_in.html">
          <div id="id01" class="modal bg bg-secondary">
            <form
              class="modal-content animate"
              action="sign_in.html"
              method="post"
            >
              <div class="imgcontainer">
                <span
                  onclick="document.getElementById('id01').style.display='none'"
                  class="close"
                  title="Close Modal"
                  >&times;</span
                >
                <img
                  src="/assets/img/images (1).png"
                  alt="Avatar"
                  class="avatar"
                />
              </div>

              <div class="container">
                <label for="uname"><b>Username</b></label>
                <input
                  type="text"
                  placeholder="Enter Username"
                  name="uname"
                  required
                />

                <label for="psw"><b>Password</b></label>
                <input
                  type="password"
                  placeholder="Enter Password"
                  name="psw"
                  required
                />

                <a href="sign_in.html"
                  ><button type="submit" href="sign_in.html">Sign up</button></a
                >
                <label>
                  <input type="checkbox" checked="checked" name="remember" />
                  Remember me
                </label>
              </div>

              <div class="container" style="background-color: #f1f1f1">
                <button
                  type="button"
                  onclick="document.getElementById('id01').style.display='none'"
                  class="cancelbtn"
                >
                  Cancel
                </button>
                <span class="psw"
                  >Forgot <a href="passwordd.html">password?</a></span
                >
              </div>
          <script>
            // Get the modal
            var modal = document.getElementById("id01");

            // When the user clicks anywhere outside of the modal, close it
            window.onclick = function (event) {
              if (event.target == modal) {
                modal.style.display = "none";
              }
            };
          </script></div>
            </form>
